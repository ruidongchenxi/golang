syntax = "proto3";
package helloworld;
option go_package = "./;helloworld";
service Hellp {
    rpc Hello(HelloRequest) returns(Response);//hello接口
}
message HelloRequest {
    string name = 1;//编号不是值
    int32 age = 2; //不支持int类型必须是int32或int64
    repeated string courses = 3; 
}
message Response {
    string reply=1;
}